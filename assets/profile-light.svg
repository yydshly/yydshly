<title id="title">yydshly — terminal profile</title><desc id="description">我在探索 AI 怎样帮助一个人把想法做成可运行、可观察的作品。这里记录交互网页、3D 世界、知识可视化与有声讲解的实践，也记录从 GitHub 和 X 上发现的方法。

每个项目尽量保留演示、源码、资料来源和验证记录。你可以先体验效果，再看它怎样实现，以及还有哪些部分需要继续完善。 Public repositories 108, original repositories 108, stars 0, followers 1. Last synchronized 2026-11-27 13:57 UTC.</desc>
