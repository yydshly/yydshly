name: Update terminal profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - profile.json
      - requirements.txt
      - scripts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: terminal-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install image dependency
        run: python -m pip install -r requirements.txt
      - name: Update public statistics and both themes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit updated profile
        run: |
          git add -- README.md assets
          if git diff --cached --quiet; then
            echo "Profile is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update terminal profile"
          git push origin HEAD:main
